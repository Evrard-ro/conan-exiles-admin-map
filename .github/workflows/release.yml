name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Windows prebuilt for better-sqlite3
        run: |
          VERSION=$(node -p "require('./node_modules/better-sqlite3/package.json').version")
          NAPI_VER=$(node -p "process.versions.napi")
          DEST=node_modules/better-sqlite3
          for napi in $NAPI_VER 9 8 7 6; do
            URL="https://github.com/WiseLibs/better-sqlite3/releases/download/v${VERSION}/better-sqlite3-v${VERSION}-napi-v${napi}-win32-x64.tar.gz"
            echo "Trying NAPI v${napi}: $URL"
            if curl -sfL "$URL" | tar -xz -C "$DEST"; then
              echo "OK: downloaded NAPI v${napi}"
              break
            fi
          done

      - name: Build
        run: npm run build

      - name: Get version
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.pkg_version.outputs.version }}"
          files: build/conan-exiles-admin-map-v${{ steps.pkg_version.outputs.version }}.zip
          generate_release_notes: true
